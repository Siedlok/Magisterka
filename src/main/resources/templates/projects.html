<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Projects</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="user-info" th:if="${username != null}">
    Logged as: <strong th:text="${username}">user</strong>
</div>
<div class="projects-container">

    <div class="projects-header">
        <h1>Projects</h1>

        <div class="top-actions">
            <a href="/projects/new" class="btn btn-add">Add Project</a>

            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="button logout-btn">Logout</button>
            </form>
        </div>
    </div>


    <div class="projects-grid" th:if="${!#lists.isEmpty(projects)}">
        <a th:each="project : ${projects}"
           th:href="@{/projects/{id}(id=${project.id})}"
           class="project-card">

            <h3 th:text="${project.name}">Project name</h3>

            <p th:if="${project.createdAt != null}"
               th:text="'Utworzono: ' + ${#temporals.format(project.createdAt, 'dd.MM.yyyy HH:mm')}">
                Created
            </p>

            <p th:if="${project.createdAt == null}">
                No creation date
            </p>

            <form th:action="@{/projects/{id}/delete(id=${project.id})}"
                  method="post"
                  class="project-delete-form"
                  onsubmit="return confirm('Are you sure you want to delete this project and all its tasks?');">
                <button type="submit" class="btn btn-delete">Delete project</button>
            </form>
        </a>
    </div>

</div>

</body>
</html>
