<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task list</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="user-info" th:if="${username != null}">
    Logged as: <strong th:text="${username}">user</strong>
</div>



<div class="top-actions">

    <div class="left-buttons">

        <a th:href="@{/tasks/new(projectId=${projectId})}" class="btn btn-add">Add Task</a>
        <a th:href="@{/stats(projectId=${projectId})}" class="btn btn-add">Stats</a>

    </div>

    <div class="right-buttons">
        <a href="/projects" class="btn btn-secondary">Return to projects</a>

        <form action="/logout" method="post" class="logout-form">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

</div>

<div class="task-list">

    <div class="task-card" th:each="task: ${tasks}">

        <div class="task-info">
            <h3><strong>Title:</strong> <span th:text="${task.title}"></span></h3>
            <p><strong>Description:</strong> <span th:text="${task.description}"></span></p>
            <p><strong>Status:</strong> <span th:text="${task.status}"></span></p>
            <p><strong>Created At:</strong> <span th:text="${task.createdAt}"></span></p>
            <p><strong>Deadline:</strong> <span th:text="${task.deadline()}"></span></p>
            <p>
                <strong>Completed at:</strong>
                <span th:text="${task.completedAt != null
        ? #temporals.format(task.completedAt, 'dd.MM.yyyy HH:mm')
        : 'Nieukończone'}">
    </span>
            </p>
            <p><strong>Created by:</strong> <span th:text="${task.userId()}"></span></p>
        </div>

        <div class="task-actions">

            <form th:action="@{/tasks/{id}/complete(id=${task.id})}"
                  method="post"
                  th:if="${task.status.name() != 'DONE'}"
                  class="inline-form">
                <button type="submit" class="btn btn-complete">Done</button>
            </form>

            <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-edit">
                Edit
            </a>

            <a th:href="@{/tasks/delete/{id}(id=${task.id})}" class="btn btn-delete">
                Delete
            </a>

        </div>

</div>
</div>
</body>
</html>
